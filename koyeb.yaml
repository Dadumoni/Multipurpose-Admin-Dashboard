name: video-preview-app
services:
  - name: web
    type: web
    dockerfile: Dockerfile
    ports:
      - port: 3000
        path: /
    routes:
      - path: /
        port: 3000
    regions:
      - fra
    scalings:
      min: 1
      max: 1
    env:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: "production"
    health_checks:
      - http:
          path: /ping
          port: 3000
        interval: 30
        timeout: 5
